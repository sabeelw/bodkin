[package]
name = "bodkin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The hunting terminal for pons v2 on Robinhood Chain. Local, open, non-custodial."

[[bin]]
name = "bodkin"
path = "src/main.rs"

[[bench]]
name = "hot_paths"
harness = false

[dependencies]
alloy.workspace = true
anyhow.workspace = true
atomic-write-file = "0.3.1"
axum.workspace = true
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
chrono.workspace = true
clap.workspace = true
dotenvy = "0.15.7"
futures-util = "0.3.31"
hdrhistogram = { version = "7.6.0", default-features = false }
hex.workspace = true
jsonrpsee = { version = "0.26.0", default-features = false, features = ["ws-client"] }
lru = "0.18.2"
parking_lot.workspace = true
redb = "4.2.0"
regex.workspace = true
reqwest.workspace = true
scopeguard = "1.2.0"
serde.workspace = true
serde_json.workspace = true
strip-ansi-escapes = "0.2.1"
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url.workspace = true

[dev-dependencies]
divan = "0.1.21"
http-body-util = "0.1.3"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
